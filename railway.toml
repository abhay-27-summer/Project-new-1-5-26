import { Link } from 'react-router-dom';
import { useQuery } from '@tanstack/react-query';
import { api } from '../api/client.js';

export default function Projects() {
  const { data, isLoading, error } = useQuery({
    queryKey: ['projects'],
    queryFn: async () => (await api.get('/projects')).data,
  });

  return (
    <div className="max-w-6xl mx-auto px-6 py-10">
      <div className="flex items-baseline justify-between mb-8">
        <div>
          <h1 className="font-display text-4xl tracking-tight">Projects</h1>
          <p className="text-ink-500 mt-1">All projects you own or belong to.</p>
        </div>
        <Link to="/projects/new" className="btn btn-accent">
          New project
        </Link>
      </div>

      {isLoading && <p className="text-ink-500 text-sm">Loading…</p>}
      {error && <p className="text-red-600 text-sm">Failed to load projects.</p>}

      {data?.projects?.length === 0 && (
        <div className="card p-12 text-center">
          <h3 className="font-display text-2xl mb-2">No projects yet</h3>
          <p className="text-ink-500 text-sm mb-6">Create your first project to get started.</p>
          <Link to="/projects/new" className="btn btn-primary">
            Create project
          </Link>
        </div>
      )}

      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        {data?.projects?.map((p) => (
          <Link
            key={p.id}
            to={`/projects/${p.id}`}
            className="card p-6 hover:border-ink-300 transition-colors"
          >
            <div className="flex items-start justify-between mb-3">
              <h3 className="font-display text-xl tracking-tight">{p.name}</h3>
              <span
                className={`badge ${
                  p.myRole === 'admin'
                    ? 'bg-ink-900 text-ink-50'
                    : 'bg-ink-100 text-ink-700'
                }`}
              >
                {p.myRole}
              </span>
            </div>
            <p className="text-sm text-ink-500 line-clamp-2 mb-4">
              {p.description || <span className="italic">No description</span>}
            </p>
            <div className="flex items-center justify-between text-xs text-ink-500">
              <span>{p.members.length + (p.owner ? 0 : 0)} members</span>
              <span>{new Date(p.updatedAt).toLocaleDateString()}</span>
            </div>
          </Link>
        ))}
      </div>
    </div>
  );
}
